<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Universe</title>
  <link rel="stylesheet" href="universe.css" />
</head>
<body>
  <div class="universe">
    <div class="stars"></div>

    <div class="nebula nebula-one"></div>
    <div class="nebula nebula-two"></div>

    <div class="planet planet-main">
      <span class="ring"></span>
      <span class="shine"></span>
    </div>

    <div class="planet planet-small"></div>

    <div class="orbit">
      <div class="moon"></div>
    </div>

    <h1>Welcome to My Universe</h1>
  </div>
</body>
</html>
